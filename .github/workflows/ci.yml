name: CI

on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**/*.rs', 'tests/**', 'src-tauri/**', 'package.json', 'package-lock.json']
  pull_request:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**/*.rs', 'tests/**', 'src-tauri/**', 'package.json', 'package-lock.json']

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache sherpa-onnx prebuilt libs
        uses: actions/cache@v6
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux audio deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Ensure components for project toolchain
        run: rustup component add rustfmt clippy

      - name: Format check
        run: cargo fmt --check

      - name: Lint check
        run: cargo clippy -- -D warnings

      - name: Install typos-cli
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli

      - name: Spell check
        run: typos .

      - name: Tests
        run: cargo test -- --test-threads=1

      - name: Build
        run: cargo build

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin

      - name: Generate coverage report
        run: cargo tarpaulin --out lcov --output-dir coverage -- --test-threads=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  app-check:
    name: Tauri App Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache sherpa-onnx prebuilt libs
        uses: actions/cache@v6
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Ensure components for project toolchain
        run: rustup component add clippy

      - name: Lint (app crate)
        run: cargo clippy -p zapmomo-app -- -D warnings

      - name: Check (app crate)
        run: cargo check -p zapmomo-app

  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Cache sherpa-onnx prebuilt libs
        uses: actions/cache@v6
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install Linux audio deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Diagnose llama CRT (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          LLAMA_STATIC_CRT: "1"
        run: |
          echo "=== env 诊断 ==="
          echo "LLAMA_STATIC_CRT=[${LLAMA_STATIC_CRT:-未设置}]"
          echo "CMAKE_GENERATOR=[${CMAKE_GENERATOR:-未设置}]"
          echo "CRATE_CC_NO_DEFAULTS=[${CRATE_CC_NO_DEFAULTS:-未设置}]"
          echo "=== 强制重编 llama-cpp-sys-2，抓 cmake 命令 ==="
          cargo clean -p llama-cpp-sys-2 2>/dev/null || true
          cargo build 2>&1 | grep -E "running:.*cmake" | head -10

      - name: Tests
        shell: bash
        env:
          # 让 llama-cpp-2 在 Windows MSVC 上用静态 CRT（/MT），匹配 sherpa-onnx 预编译库的 /MT
          LLAMA_STATIC_CRT: "1"
        run: |
          # GitHub Actions Windows runner 预设 CMAKE_GENERATOR=Visual Studio，会让 cmake crate 跳过
          # static_crt 通过 CMAKE_CXX_FLAGS_RELEASE 的传递（该分支要求 generator.is_none()）。
          # unset 后走默认路径，让 /MT 正确传递给 llama.cpp。
          unset CMAKE_GENERATOR CMAKE_GENERATOR_PLATFORM CMAKE_GENERATOR_TOOLSET CMAKE_GENERATOR_INSTANCE 2>/dev/null || true
          cargo test -- --test-threads=1
