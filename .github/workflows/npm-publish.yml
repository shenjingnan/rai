name: npm Publish (dsh-plugin)

# 发布 integrations/dsh-plugin → npm @zapmomo-ai/dsh-plugin。
# 触发：手动 dispatch，或推送 dsh-plugin-v* tag（发版流程：改 version → 打 tag → push）。
#
# 认证走 npm Trusted Publishing（OIDC），不依赖 NPM_TOKEN：
# - npm 侧已为 @zapmomo-ai/dsh-plugin 配置 Trusted Publisher（绑定本仓库 + 本 workflow 文件名）
# - GitHub 注入 OIDC id-token，npm CLI（>= 11.5.1）自动用它认证并生成 provenance
# - 要求 npm 侧「Workflow filename」= npm-publish.yml，且「Environment」留空
on:
  workflow_dispatch:
  push:
    tags:
      - 'dsh-plugin-v*'

permissions:
  contents: read
  id-token: write # OIDC Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/dsh-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # OIDC 发布需要 npm CLI >= 11.5.1；Node 22 自带 npm 10.x，必须显式升级
      - name: Upgrade npm for OIDC
        run: npm install -g npm@latest
      # package.json version 未变时 npm publish 会以 E403（already published）拒绝——正常保护。
      # 发布后 package.json 的 version 记得递增，再打 dsh-plugin-vX.Y.Z tag。
      - name: Publish to npm
        run: npm publish
