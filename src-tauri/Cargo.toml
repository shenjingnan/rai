[package]
name = "zapmomo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 桌面框架（protocol-asset 用于通过 asset:// 协议把本地模型文件喂给 WebView；
# macos-private-api 用于 macOS 透明桌宠窗口）
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }

# 文件/目录选择对话框（用户加载 Live2D 模型目录）
tauri-plugin-dialog = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志（复用根 crate 的 init_logging 初始化双层 tracing）
tracing = "0.1"

# 复用根 crate 的 KWS / 音频 / 配置逻辑
zapmomo = { path = ".." }
