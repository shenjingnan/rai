name: Release

# 每次 release-plz 创建 vX.Y.Z tag（推送）后，在原生 runner 上构建
# Windows / macOS（双架构）/ Linux 的安装包，合并到一个 GitHub Release。
# 构建成功后自动发布为正式 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Sync tauri version to tag
        # tauri 打包版本取自 tauri.conf.json，需与 release-plz 打出的 vX.Y.Z tag 对齐。
        # 用 node（各平台 runner 均预装）更新 JSON：Windows 默认 shell 是 PowerShell（bash 语法会报错），
        # 且 windows runner 未预装 jq。
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node - <<'EOF'
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.version = process.env.VERSION;
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          EOF

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev

      - name: Setup pnpm
        # 版本由根 package.json 的 packageManager 字段决定（pnpm@10.18.2）
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install frontend deps
        # 安装除 docs（Next.js）外的所有 workspace：根包（@tauri-apps/cli）+ frontend（React）
        # 注意：--filter 按包名匹配，docs workspace 的包名为 zapmomo-docs
        run: pnpm install --filter '!zapmomo-docs' --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Install macOS cross-compile targets
        if: matrix.platform == 'macos-latest'
        # 安装 macOS 交叉编译 target（aarch64 + x86_64）。
        # dtolnay 装的工具链（1.97.1）与 rust-toolchain.toml 一致；
        # rustup target add 运行于项目目录，遵循 override 装到激活的工具链上。
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache sherpa-onnx prebuilt libs
        uses: actions/cache@v6
        with:
          path: target/sherpa-onnx-prebuilt
          key: sherpa-onnx-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 配置证书后由 tauri-action 自动签名/公证 macOS 产物
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true

      - name: Attach installers to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            *.dmg
            *.app.tar.gz
            *.deb
            *.rpm
            *.AppImage
            *.msi
            *.exe
