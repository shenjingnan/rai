<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAI · KWS 控制面板</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>RAI</h1>
    <span id="app-version" class="muted"></span>
    <span id="status" class="status idle">空闲</span>
  </header>

  <main>
    <section class="card">
      <h2>实时监听</h2>
      <div class="row">
        <label for="device">麦克风</label>
        <select id="device"></select>
        <button id="refresh-devices" class="btn ghost">刷新</button>
      </div>
      <div class="row">
        <label for="keywords">附加关键词</label>
        <input id="keywords" type="text"
          placeholder="可选：直接输入中文（如 你好小智），多个用 / 分隔" />
      </div>
      <div class="row">
        <button id="start" class="btn primary">开始监听</button>
        <button id="stop" class="btn danger" disabled>停止监听</button>
      </div>
      <p id="listen-error" class="error hidden"></p>
    </section>

    <section class="card">
      <h2>配置</h2>
      <dl id="config"></dl>
      <p id="model-hint" class="warn hidden"></p>
    </section>

    <section class="card">
      <h2>检测结果</h2>
      <ul id="results" class="results"></ul>
    </section>
  </main>

  <script src="main.js"></script>
</body>
</html>
