[workspace]
# release-plz 负责版本号 / git tag / changelog / crates.io 发布。
# GitHub Release 与桌面安装包由 .github/workflows/release.yml（Tauri）接管。
git_release_enable = false
git_tag_enable = false

[[package]]
name = "rai"
git_tag_enable = true
git_tag_name = "v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"

[[package]]
name = "rai-app"
# 桌面应用 crate：不发布 crates.io，也不单独打 tag（随 workspace 一起 bump 版本）
# publish = false 需与 src-tauri/Cargo.toml 的 publish = false 保持一致，否则 release-plz 报错
publish = false
release = false
git_tag_enable = false
