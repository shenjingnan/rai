[workspace]
members = ["src-tauri"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.1.5"
edition = "2024"
# 统一使用固定工具链 1.97.1（见 rust-toolchain.toml）；最低支持版本 1.97
rust-version = "1.97"
description = "An open-source, real-time desktop AI companion with voice, memory, and a customizable virtual character."
license = "MIT"

[package]
name = "zapmomo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
# CLI 框架
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# 音频采集（麦克风）
cpal = "0.18"

# 关键词检测（KWS），默认 static 特性：构建时下载预编译库
sherpa-onnx = "1.13"

# 汉字 → 带声调拼音（把用户输入的原始中文关键词转成模型可编码的 ppinyin token）
pinyin = "0.11"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# 错误处理
thiserror = "2"
anyhow = "1"

# 时间处理
chrono = "0.4"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }

# 模型下载安装（HTTP + sha256 校验 + tar.bz2 解压）
ureq = "2"
sha2 = "0.10"
hex = "0.4"
tar = { version = "0.4", default-features = false }
bzip2 = "0.4"

# --- 可选依赖（按需取消注释） ---
# reqwest = { version = "0.12", features = ["json"] }   # HTTP 客户端
# url = "2"                                              # URL 解析
# futures-util = "0.3"                                   # 异步流处理

[dev-dependencies]
tempfile = "3"

# 发布构建：减小编译产物/安装包体积
[profile.release]
lto = "thin"
strip = "symbols"
